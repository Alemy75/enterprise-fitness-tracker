# Local development dependencies (EFT-002).
# Usage: docker compose -f infra/compose/docker-compose.yml up -d
name: eft

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eft
      POSTGRES_PASSWORD: eft
      POSTGRES_DB: eft
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eft -d eft']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
